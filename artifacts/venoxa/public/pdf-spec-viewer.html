<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PDF Spec Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.min.mjs" type="module"></script>
<style>
  body { margin: 0; background: #333; }
  canvas { display: block; margin: 8px auto; box-shadow: 0 2px 12px rgba(0,0,0,.5); }
</style>
</head>
<body>
<script type="module">
  const pdfjsLib = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.min.mjs");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.worker.min.mjs";
  const doc = await pdfjsLib.getDocument({ url: "/level-test-preview.pdf" }).promise;
  const scale = parseFloat(new URLSearchParams(location.search).get("scale") || "2");
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const vp = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.id = "pg" + p;
    canvas.width = vp.width; canvas.height = vp.height;
    document.body.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    const note = document.createElement("div");
    note.textContent = "PAGE " + p;
    note.style.cssText = "color:#fff;font:bold 14px monospace;text-align:center;margin:4px";
    document.body.appendChild(note);
  }
  document.title = "PDF-READY";
</script>
</body>
</html>
