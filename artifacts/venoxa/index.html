<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venoxa AI – Learn English step by step</title>
    <meta name="description" content="A clear path from your first words to confident conversations. Short lessons, smart practice, and a friendly AI teacher. Start at your level — A1 to C1." />
    <meta property="og:title" content="Venoxa AI – Learn English step by step" />
    <meta property="og:description" content="A clear path from your first words to confident conversations. Short lessons, smart practice, and a friendly AI teacher." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Venoxa AI" />
    <!-- Apply the saved theme/language before first paint (no flash). -->
    <script>
      try {
        if (localStorage.getItem('venoxa_theme') === 'dark') document.documentElement.classList.add('dark');
        var _vxLang = localStorage.getItem('venoxa_lang');
        if (_vxLang) document.documentElement.dir = _vxLang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
